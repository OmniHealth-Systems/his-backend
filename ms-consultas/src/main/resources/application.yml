server:
  port: 8089

spring:
  application:
    name: ms-consultas
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/consultas_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    registerWithEureka: true
    fetchRegistry: true

feign:
  client:
    config:
      ms-pacientes:
        url: ${MS_PACIENTES_URL:http://localhost:8083}
      ms-usuarios:
        url: ${MS_USUARIOS_URL:http://localhost:8084}
      ms-citas:
        url: ${MS_CITAS_URL:http://localhost:8082}
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
