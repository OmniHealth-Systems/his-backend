name: OmniHIS Cloud - CI/CD Docker Build Matrix

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Containerize ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway-service
          - ms-sedes
          - ms-citas
          - ms-pacientes
          - ms-usuarios
          - ms-reportes
          - ms-historial
          - ms-facturacion
          - ms-notificaciones
          - ms-consultas
          - ms-laboratorio
          - ms-farmacia
          - ms-auditoria

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Service JAR with Maven
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: omnihis/${{ matrix.service }}:${{ github.sha }}
          load: true
